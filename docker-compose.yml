# Local dev stack — `docker compose up` brings the walking skeleton up clean.
# The backend service is named `app` to match CLAUDE.md's run-commands
# (`docker compose exec app pytest`, `... mypy app/`, `... python -m scripts.seed_demo`).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tolera
      POSTGRES_PASSWORD: tolera
      POSTGRES_DB: tolera
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tolera -d tolera"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO — S3-compatible object store for part files (M1.2). Prod swaps in an
  # EU-resident bucket behind the same S3 API (DECISIONS.md 2026-06-25).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # web console
    volumes:
      - miniodata:/data
    healthcheck:
      # `mc ready local` needs a configured alias that doesn't exist in the server
      # container; use the readiness endpoint via curl (present in minio/minio).
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the bucket the app expects, then exit.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/tolera-files
      "

  app:
    build:
      context: .
      target: dev
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      # DATABASE_URL = owner role (runs `alembic upgrade head`).
      DATABASE_URL: postgresql+asyncpg://tolera:tolera@db:5432/tolera
      # APP_DATABASE_URL = restricted, RLS-bound role the app serves requests as
      # (M0.2 two-role split; role created by docker/initdb/02-create-app-role.sql).
      APP_DATABASE_URL: postgresql+asyncpg://tolera_app:tolera_app@db:5432/tolera
      TEST_DATABASE_URL: postgresql+asyncpg://tolera:tolera@db:5432/tolera_test
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      # Object storage — MinIO in dev (M1.2).
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: tolera-files
      S3_REGION: eu-central-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Wait for the bucket to be created so the first upload can't hit NoSuchBucket.
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: dev
    # -Q celery,email: the M3.5 sync tasks ride the dedicated "email" queue
    # (concurrency capped here by the single worker; scale out = a dedicated
    # email worker with its own --concurrency).
    command: celery -A app.celery_app worker -Q celery,email --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+asyncpg://tolera:tolera@db:5432/tolera
      APP_DATABASE_URL: postgresql+asyncpg://tolera_app:tolera_app@db:5432/tolera
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: tolera-files
      S3_REGION: eu-central-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  beat:
    build:
      context: .
      target: dev
    # Schedules app.email_sync_all every 5 min (celery_app.beat_schedule).
    command: celery -A app.celery_app beat --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+asyncpg://tolera:tolera@db:5432/tolera
      APP_DATABASE_URL: postgresql+asyncpg://tolera_app:tolera_app@db:5432/tolera
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: tolera-files
      S3_REGION: eu-central-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:

