# Local dev stack — `docker compose up` brings the walking skeleton up clean.
# The backend service is named `app` to match CLAUDE.md's run-commands
# (`docker compose exec app pytest`, `... mypy app/`, `... python -m scripts.seed_demo`).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tolera
      POSTGRES_PASSWORD: tolera
      POSTGRES_DB: tolera
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tolera -d tolera"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: dev
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      # DATABASE_URL = owner role (runs `alembic upgrade head`).
      DATABASE_URL: postgresql+asyncpg://tolera:tolera@db:5432/tolera
      # APP_DATABASE_URL = restricted, RLS-bound role the app serves requests as
      # (M0.2 two-role split; role created by docker/initdb/02-create-app-role.sql).
      APP_DATABASE_URL: postgresql+asyncpg://tolera_app:tolera_app@db:5432/tolera
      TEST_DATABASE_URL: postgresql+asyncpg://tolera:tolera@db:5432/tolera_test
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: dev
    command: celery -A app.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+asyncpg://tolera:tolera@db:5432/tolera
      APP_DATABASE_URL: postgresql+asyncpg://tolera_app:tolera_app@db:5432/tolera
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
