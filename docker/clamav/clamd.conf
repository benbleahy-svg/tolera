# clamd configuration for the Tolera dev/CI sidecar (M3.13).
#
# The worker streams uploads over TCP (INSTREAM) because clamd runs in its own
# container and shares no filesystem with it — so the stream limits, not the
# file-scan limits, are what matter here.

LogTime yes
# Log to stdout so the verdict trail lands in `docker compose logs`, not a file
# inside the container.
LogFile /dev/stdout
Foreground yes

TCPSocket 3310
TCPAddr 0.0.0.0

# The app caps uploads at MAX_UPLOAD_MB (200). Every limit below must clear that
# ceiling, or a legitimate 200 MB CAD file would come back as an ERROR — which
# the task records as `error`, blocking a clean file's download indefinitely.
StreamMaxLength 256M
MaxFileSize 256M
MaxScanSize 512M

# Archives: customers do send ZIPs of prints (M3.3 ingest recurses them), so scan
# inside them, with the stock recursion/ratio guards against zip bombs.
ScanArchive yes
MaxRecursion 16
MaxFiles 10000
