# clamd configuration for the Tolera dev/CI sidecar (M3.13).
#
# The worker streams uploads over TCP (INSTREAM) because clamd runs in its own
# container and shares no filesystem with it — so the stream limits, not the
# file-scan limits, are what matter here.

LogTime yes
# No LogFile: with `Foreground yes` clamd writes to stdout natively, which is
# what lands the verdict trail in `docker compose logs`. Pointing LogFile at
# /dev/stdout instead kills clamd at boot ("Symbolic link loop" — the image's
# init script gives clamd an fd 1 that /dev/stdout resolves back onto), so the
# socket never opens and the container sits unhealthy forever.
Foreground yes

# The image's /init waits for this exact unix socket and `exit 1`s the whole
# container after 30 min if it never appears — clamd must keep it even though
# the worker only ever connects over TCP.
LocalSocket /run/clamav/clamd.sock

TCPSocket 3310
# No TCPAddr: unset, clamd binds every interface on BOTH stacks (0.0.0.0 and
# ::). Pinning it to 0.0.0.0 leaves ::1 unbound, and the image healthcheck's
# `nc localhost 3310` resolves to ::1 first — so the container reads unhealthy
# even with clamd fully up.

# The app caps uploads at MAX_UPLOAD_MB (200). Every limit below must clear that
# ceiling, or a legitimate 200 MB CAD file would come back as an ERROR — which
# the task records as `error`, blocking a clean file's download indefinitely.
StreamMaxLength 256M
MaxFileSize 256M
MaxScanSize 512M

# Archives: customers do send ZIPs of prints (M3.3 ingest recurses them), so scan
# inside them, with the stock recursion/ratio guards against zip bombs.
ScanArchive yes
MaxRecursion 16
MaxFiles 10000
