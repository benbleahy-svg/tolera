[project]
name = "tolera"
version = "0.1.0"
description = "Tolera — DACH instant-quoting platform (backend walking skeleton)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "prometheus-client>=0.21.0",
    "pyjwt[crypto]>=2.10.0",
    # M1.2 — file upload & storage
    "python-multipart>=0.0.12",  # FastAPI multipart/UploadFile parsing
    "aioboto3>=13.0.0",  # async S3-compatible object storage (MinIO / EU bucket)
    "pypdf>=6.14.2",
    # Explicit: SQLAlchemy's greenlet marker misses arm64 macOS, breaking fresh venvs.
    "greenlet>=3.5.2",
    "anthropic>=0.116.0,<1",  # SDK allows breaking minors; uv.lock pins the exact build
    # M3.5 — two-way email threading
    "httpx>=0.28.0",  # Gmail/Graph REST calls (was dev-only via TestClient)
    "cryptography>=43.0.0",  # AES-256-GCM credentials-at-rest (imported directly)
    # M3.7/M3.8 — ReDoS containment (DECISIONS.md 2026-07-16, option (a)).
    # stdlib `re` CANNOT be bounded: SRE runs in C holding the GIL and never
    # checks for interrupts, so no thread/signal timeout can stop a backtracking
    # match. `regex` enforces `timeout=` inside the engine. Do not swap back.
    "regex>=2024.11.6",
    "pgvector>=0.5.0",
    # M5.4 — white-label quote/order PDF. WeasyPrint renders Jinja2 HTML → PDF
    # server-side (needs native pango/cairo; installed in CI + the Docker
    # dev/prod/worker stages). Jinja2 is the template engine (already transitively
    # present via FastAPI, pinned explicitly here as a direct import).
    "weasyprint>=63.0",
    "jinja2>=3.1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "types-regex>=2024.11.6",  # stubs for the ReDoS-bounded rule-regex engine
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
# M4.1 — GeometryService (OCCT via the OCP bindings; DECISIONS.md 2026-07-16:
# pythonocc-core has no pip wheels). A separate group because the wheel pulls in
# vtk (~102 MB): the Celery worker image installs it, the API image must NOT
# (interrogation runs on workers only — GEOMETRY.md §0).
geometry = [
    "cadquery-ocp>=7.9,<7.10",
]

[tool.uv]
package = false
# Local dev + CI get the geometry engine (tests exercise it); production images
# opt in explicitly (Dockerfile: API prod uses --no-default-groups, worker adds
# --group geometry).
default-groups = ["dev", "geometry"]

# ---------------------------------------------------------------------------
# Ruff — lint + format (CI runs `ruff check .` and `ruff format --check .`).
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["clerk-react", "clerk-nextjs", "ui-prototype"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Alembic migration scaffolding keeps its generated shape.
"alembic/**" = ["E402", "F401"]

# ---------------------------------------------------------------------------
# mypy — type checking (CI runs `mypy .`).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
# scripts/spike-m4.0 = throwaway M4.0 OCCT probe scaffold (PEP 723 scripts outside the
# project env; wiring cadquery-ocp-stubs into strict mypy isn't warranted for code that
# M4.1 deletes/productionizes) — excluded from typing, ruff still runs.
exclude = ['(^|/)(alembic|clerk-react|clerk-nextjs|ui-prototype|frontend|e2e)/', '(^|/)scripts/spike-m4\.0/']

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

# OCP (cadquery-ocp) ships no stubs; the OCCT bindings are confined to
# app/geometry/occt.py behind the typed GeometryService contract.
[[tool.mypy.overrides]]
module = ["OCP.*"]
ignore_missing_imports = true

# aioboto3 / boto3 ship incomplete stubs; the async S3 client is dynamic.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

# WeasyPrint ships no py.typed marker (M5.4 PDF rendering).
[[tool.mypy.overrides]]
module = ["weasyprint.*"]
ignore_missing_imports = true

# Celery is untyped; its decorator + base class would otherwise trip strict mode.
[[tool.mypy.overrides]]
module = [
    "app.tasks",
    "app.av_scan",
    "app.celery_app",
    "app.file_split",
    "app.interrogation",
    "app.lens_extract",
    "app.part_index",
    "app.email_ingest",
    "app.email_parts",
    "app.email_sync",
    "app.review_items",
    "app.triage",
    "app.rule_suggest",
    "app.requote_diff",
    "app.bulk_refresh",
    "app.event_dispatch_tasks",
    "app.vendor_reply_lens",
    "app.vendor_rfq_email",
]
disallow_untyped_decorators = false
disallow_subclassing_any = false

# ---------------------------------------------------------------------------
# pytest + coverage.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
# `not eval` deselects the M3.11 live Lens quality suite by default — it calls
# the model, so it must not run on every PR (block M3.11). The dedicated
# `lens-eval` workflow opts back in with `pytest -m eval`. The model-free
# scorer meta-test (`test_lens_eval_scorer.py`) is NOT marked, so it still
# gates every PR.
addopts = "-ra -m 'not eval'"
markers = [
    "eval: live Lens extraction quality suite (calls the model; cost-gated, run via `-m eval`)",
]
filterwarnings = [
    # Starlette's TestClient prefers the (not-yet-pinned) httpx2; harmless here.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/celery_app.py"]
# SQLAlchemy's asyncio bridge runs handler code inside greenlets after the
# first DB await — without greenlet concurrency support coverage silently
# drops every such frame, under-counting all API request paths.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
