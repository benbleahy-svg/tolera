# CI — gates every PR into develop/main. Wired to the app code in M0.1.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tolera
          POSTGRES_PASSWORD: tolera
          POSTGRES_DB: tolera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tolera -d tolera_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Exercises the readiness probe's real Postgres round-trip (M0.1 acceptance).
      TEST_DATABASE_URL: postgresql+asyncpg://tolera:tolera@localhost:5432/tolera_test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --all-extras --dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Types (mypy)
        run: uv run mypy .
      - name: Tests + coverage (pytest)
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # eval-suite:  # ENABLE AT M3.11 — Lens extraction quality gate.
  #   Scores precision/recall/F1 per field category vs. spec thresholds at temperature 0 + pinned model.
  #   Gates on thresholds + regression-vs-baseline, NOT exact-match of model output.
