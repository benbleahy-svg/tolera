# CI — gates every PR into develop/main. Wired to the app code in M0.1.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tolera
          POSTGRES_PASSWORD: tolera
          POSTGRES_DB: tolera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tolera -d tolera_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Exercises the readiness probe's real Postgres round-trip (M0.1 acceptance).
      TEST_DATABASE_URL: postgresql+asyncpg://tolera:tolera@localhost:5432/tolera_test
    steps:
      - uses: actions/checkout@v4
      # WeasyPrint (M5.4 quote/order PDF) needs the pango/cairo native libs at
      # import time; without them the PDF-render tests would skip and the gate
      # would be blind. libpango pulls cairo/harfbuzz/gdk-pixbuf transitively.
      - name: Install WeasyPrint native libs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --all-extras --dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Types (mypy)
        run: uv run mypy .
      - name: Tests + coverage (pytest)
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80

  # Tier-1 mechanical rules (money-as-float, Kalk determinism, raw DDL, secrets
  # in logs, org scoping) — .semgrep/tier1.yml. Merge-blocking.
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # scanning needs the tree and nothing else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      # ERROR blocks the merge. WARNING-tier rules (model-missing-org-id,
      # imperial-units) are reported but non-blocking — scanning only at
      # --severity ERROR hid them entirely, so nobody ever saw them.
      - name: Tier-1 rules (WARNING — advisory)
        run: semgrep scan --config .semgrep/tier1.yml --severity WARNING . || true
      - name: Tier-1 rules (ERROR — merge-blocking)
        run: semgrep scan --config .semgrep/tier1.yml --error --severity ERROR .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # Lens extraction quality gate (M3.11) lives in its OWN workflow — `lens-eval.yml`.
  # It calls the model, so it must NOT run on every PR (cost); it runs on M3-lens
  # PRs + nightly. The model-free scorer meta-test (`test_lens_eval_scorer.py`)
  # still gates every PR here in `backend` (it is not marked `eval`).
