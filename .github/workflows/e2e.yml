# E2E — the acceptance-demo gate (e2e/README.md). While every demo is still
# `test.fixme` this passes green without booting anything. Once a demo is
# promoted it boots the full stack (compose backend + Vite frontend) and replays
# the promoted demos. Secrets needed from then on: CLERK_SECRET_KEY,
# CLERK_PUBLISHABLE_KEY (gh secret set …).
# NOTE: the first promoted-demo run may need small fixes (env names, ports) —
# that is expected; the autobuild driver's CI-fix loop handles it. Make this a
# required check via scripts/setup-automerge.sh once it has passed once.
name: E2E

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: http://localhost:5173
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install demo harness
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Detect promoted demos
        id: promoted
        run: |
          if grep -RnE '^\s*test(\.only)?\(' e2e/demos --include='*.spec.ts' | grep -vq fixme; then
            echo "any=true" >> "$GITHUB_OUTPUT"; echo "Promoted demos found — booting the app."
          else
            echo "any=false" >> "$GITHUB_OUTPUT"; echo "All demos still fixme — suite runs without the app."
          fi

      # A promoted demo without Clerk secrets does NOT fail on its own:
      # e2e/global.setup.ts calls setup.skip(!CLERK_SECRET_KEY), so the suite
      # reports GREEN having run no acceptance test at all — and secrets are
      # absent by design on fork PRs. A silent-green merge gate is worse than no
      # gate, so fail loudly the moment a demo is promoted without its secrets.
      - name: Require Clerk secrets once demos are promoted
        if: steps.promoted.outputs.any == 'true'
        run: |
          missing=
          [ -n "$CLERK_SECRET_KEY" ]      || missing="$missing CLERK_SECRET_KEY"
          [ -n "$CLERK_PUBLISHABLE_KEY" ] || missing="$missing CLERK_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Promoted demos need:$missing — global.setup.ts would skip and this job would pass green without running them. Set via 'gh secret set <NAME>' (note: fork PRs cannot read secrets)."
            exit 1
          fi
          echo "Clerk secrets present — the promoted demos will actually run."

      - name: Boot backend stack (compose)
        if: steps.promoted.outputs.any == 'true'
        run: |
          docker compose up -d --build
          # wait for the API health endpoint
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/health && break; sleep 2; done

      - name: Boot frontend (Vite dev server)
        if: steps.promoted.outputs.any == 'true'
        working-directory: frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          npm ci
          nohup npm run dev >/tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:5173 && break; sleep 2; done

      - name: Run demo suite
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report (the N/14 scoreboard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
